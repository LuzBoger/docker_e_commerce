version: "3.8"
services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=${NODE_ENV}
      - VITE_PRODUCT_SERVICE_URL=http://product-service:3000
      - VITE_AUTH_SERVICE_URL=http://auth-service:3001
      - VITE_ORDER_SERVICE_URL=http://order-service:3002

  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=${NODE_ENV}
      - MONGODB_URI=mongodb://mongo:27017/docker_e_commerce
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - mongo

  order-service:
    build:
      context: ./services/order-service
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=${NODE_ENV}
      - MONGODB_URI=mongodb://mongo:27017/docker_e_commerce
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - mongo

  product-service:
    build:
      context: ./services/product-service
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=${NODE_ENV}
      - MONGODB_URI=mongodb://mongo:27017/docker_e_commerce
    depends_on:
      - mongo

  mongo:
    image: mongo:4.4
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
